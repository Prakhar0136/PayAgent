services:
  postgres:
    image: postgres:16-alpine
    container_name: payagent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: payagent
      POSTGRES_PASSWORD: payagent_dev_password
      POSTGRES_DB: payagent_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
